 <!-- Portfolio Modals -->
 {% for post in site.posts %}
    <div class="portfolio-modal modal fade" id="portfolioModal{{ post.modal-id }}" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-content">
            <div class="close-modal" data-dismiss="modal">
                <div class="lr">
                    <div class="rl">
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="row">
                    <div class="col-lg-8 col-lg-offset-2">
                        <div class="modal-body">
                            <h2>{{ post.title }}</h2>
                            <hr class="star-primary">
                            
                            <div class="row">
                                <div class="col-lg-12">
                                    <div id="carousel-example-generic" class="carousel slide" data-ride="carousel">

                                        <ol class="carousel-indicators">
                                            {% for image in post.images %}
                                            <li data-target="#carousel-example-generic" data-slide-to="{{ forloop.index0 }}" class="{% if forloop.first %}active{% endif %}"></li>
                                            {% endfor %}
                                        </ol>
                            
                                        <!-- Carousel items -->
                                        <div class="carousel-inner" role="listbox">
                                            {% for image in post.images %}
                                            <div class="item {% if forloop.first %}active{% endif %}">
                                                <img src="img/portfolio/{{ image.img }}" alt="{{ post.title }}" class="img-responsive img-centered">
                                            </div>
                                            {% endfor %}
                                            <!-- <div class="item active">
                                                <img src="img/portfolio/natural-1.jpg"  class="img-responsive img-centered" alt="">
                                            </div>
                                            <div class="item">
                                                <img src="img/portfolio/natural-2.jpg" class="img-responsive img-centered" alt="">
                                            </div>
                                            <div class="item">
                                                <img src="img/portfolio/natural-3.jpg" class="img-responsive img-centered" alt="">
                                            </div> -->
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <p>{{ post.description }}</p>
                            <ul class="list-inline item-details">
                                <li>Client:
                                    <strong><a href="http://startbootstrap.com">{{ post.client }}</a>
                                    </strong>
                                </li>
                                <li>Date:
                                    <strong><a href="http://startbootstrap.com">{{ post.project-date }}</a>
                                    </strong>
                                </li>
                                <li>Service:
                                    <strong><a href="http://startbootstrap.com">{{ post.category }}</a>
                                    </strong>
                                </li>
                            </ul>
                            <button type="button" class="btn btn-default" data-dismiss="modal"><i class="fa fa-times"></i> Close</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endfor %}
